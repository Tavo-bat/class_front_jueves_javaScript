<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>App Usuarios</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!--REGISTRO-->
  <section id="seccion-registro">
    <h2>Registro</h2>

    <input type="text" id="input-nombre" placeholder="Nombre completo">
    <input type="email" id="input-email" placeholder="Correo electrónico">
    <input type="password" id="input-password" placeholder="Contraseña">

    <button id="btn-registrar">Registrarse</button>
    <p id="mensaje-registro"></p>

    <p>¿Ya tienes cuenta? <a href="#" id="link-ir-login">Inicia sesión</a></p>
  </section>

  <!--LOGIN-->
  <section id="seccion-login">
    <h2>Iniciar Sesión</h2>

    <input type="email" id="input-email-login" placeholder="Correo electrónico">
    <input type="password" id="input-password-login" placeholder="Contraseña">

    <button id="btn-login">Entrar</button>
    <p id="mensaje-login"></p>

    <p>¿No tienes cuenta? <a href="#" id="link-ir-registro">Regístrate</a></p>
  </section>

  <!--PANEL-->
  <section id="seccion-panel">
    <h2>Bienvenido, <span id="nombre-activo"></span></h2>
    <h3>Usuarios registrados:</h3>

    <!-- lista de usuarios en app -->
    <ul id="lista-usuarios"></ul>

    <button id="btn-logout">Cerrar sesión</button>
  </section>

  <script src="promesas.js"></script>
</body>
</html>
