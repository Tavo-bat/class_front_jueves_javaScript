<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To Do List</title>
    <link rel="icon" type="image/png" href="./img/like.jpg" />
    <link rel="stylesheet" href="./CSS/styles.css" />
    <script src="./JS/app.js" defer></script>
  </head>
  <body>
    <div class="contenedor">
      <h1>To Do List</h1>
      <form action="#" id="userInput">
        <input
          type="text"
          id="input-tarea"
          placeholder="Agregar una tarea..."
          autofocus
        />
        <input type="submit" value="+" id="addBtn" />
      </form>
      <ul id="lista-tareas"></ul>
      <div class="panel-estadisticas">
        <p class="contador-item">
          Tareas pendientes:
          <span id="contador-pendientes" class="numero-conteo">0</span>
        </p>
        <p class="contador-item">
          Tareas completadas:
          <span id="contador-completadas" class="numero-conteo">0</span>
        </p>
      </div>
    </div>
  </body>
</html>
